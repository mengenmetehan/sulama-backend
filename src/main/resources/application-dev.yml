spring:
  datasource:
    url: jdbc:h2:mem:sulama;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # H2 uyumluluğu için PostgreSQL-specific syntax'ı atla
    baseline-on-migrate: true

logging:
  level:
    com.sulama: DEBUG
    org.eclipse.paho: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Dev ortamında MQTT broker yoksa mock modda çalış
mqtt:
  broker:
    mock-enabled: true
