spring:
  datasource:
    url: jdbc:h2:mem:sulama;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # H2 uyumluluğu için PostgreSQL-specific syntax'ı atla
    baseline-on-migrate: true

logging:
  level:
    com.sulama: DEBUG
    org.eclipse.paho: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Dev ortamında MQTT broker yoksa mock modda çalış
mqtt:
  broker:
    mock-enabled: true

# JWT Ayarları
jwt:
  secret: ${JWT_SECRET:sulama-jwt-secret-key-must-be-at-least-32-chars!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 saat

# Varsayılan admin kullanıcısı (env var ile override et!)
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:sulama2024}
