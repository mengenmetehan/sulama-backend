server:
  port: 8080

spring:
  application:
    name: sulama-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# MQTT Configuration
mqtt:
  broker:
    url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:sulama-backend}
    username: ${MQTT_USERNAME:sulama}
    password: ${MQTT_PASSWORD:sulama_mqtt_2024}
    connection-timeout: 30
    keep-alive-interval: 60
    automatic-reconnect: true
  topics:
    command: sulama/command
    status: sulama/status

# Sulama ayarları
irrigation:
  soil-moisture:
    low-threshold: 30
    high-threshold: 70
  motor:
    max-runtime-minutes: 180
    pulse-confirmation-timeout-seconds: 10
