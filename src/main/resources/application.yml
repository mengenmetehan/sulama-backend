server:
  port: 8080

spring:
  application:
    name: sulama-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# MQTT Configuration
mqtt:
  broker:
    url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:sulama-backend}
    username: ${MQTT_USERNAME:sulama}
    password: ${MQTT_PASSWORD:sulama_mqtt_2024}
    connection-timeout: 30
    keep-alive-interval: 60
    automatic-reconnect: true
  topics:
    command: sulama/command
    status: sulama/status

# Sulama ayarları
irrigation:
  soil-moisture:
    low-threshold: 30
    high-threshold: 70
  motor:
    max-runtime-minutes: 600
    pulse-confirmation-timeout-seconds: 10

# JWT Ayarları
jwt:
  secret: ${JWT_SECRET:sulama-jwt-secret-key-must-be-at-least-32-chars!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 saat

# Varsayılan admin kullanıcısı (env var ile override et!)
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:sulama2024}

app:
  users:
    - username: ${USER1_USERNAME:ahmet}
      password: ${USER1_PASSWORD:}
    - username: ${USER2_USERNAME:mehmet}
      password: ${USER2_PASSWORD:}
    - username: ${USER3_USERNAME:mehmet}
      password: ${USER3_PASSWORD:}

# Firebase / FCM
firebase:
  enabled: ${FIREBASE_ENABLED:true}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
