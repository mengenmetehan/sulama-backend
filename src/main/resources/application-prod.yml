spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sulama}
    username: ${SPRING_DATASOURCE_USERNAME:sulama_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sulama_secret_2024}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.sulama: INFO
    org.eclipse.paho: WARN

mqtt:
  broker:
    mock-enabled: false
