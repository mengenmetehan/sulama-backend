spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sulama}
    username: ${SPRING_DATASOURCE_USERNAME:sulama_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sulama_secret_2024}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      keepalive-time: 300000
      max-lifetime: 600000
      validation-timeout: 5000
      connection-test-query: SELECT 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true

logging:
  level:
    com.sulama: INFO
    org.eclipse.paho: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.type.descriptor.sql: WARN

mqtt:
  broker:
    mock-enabled: false

# JWT Ayarları
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 saat

# Varsayılan admin kullanıcısı (env var ile override et!)
admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
